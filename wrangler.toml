name = "cfblog"
main = "src/index.ts"
compatibility_date = "2026-08-14"

# Local development settings
# Note: AI binding will still connect to remote even in local mode
# This is expected behavior and will incur usage charges

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "cfblog-db"
database_id = "e48b7378-660b-4870-8237-bb029a6eef7d"

# R2 Storage binding
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "cfblog-media"

# KV cache binding (optional — code falls back gracefully without it; not used in current deployment)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# Workers AI binding
# Note: In local dev mode, AI still connects to remote Cloudflare AI
[ai]
binding = "AI"

[assets]
binding = "ASSETS"
directory = "./public"
not_found_handling = "none"
run_worker_first = true
